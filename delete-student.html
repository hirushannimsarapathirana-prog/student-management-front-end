<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Delete Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-danger text-white">
            <h3>Delete Student</h3>
        </div>

        <div class="card-body">

            <form>

                <div class="mb-3">
                    <label class="form-label">Student ID</label>
                    <input id="id" type="number" class="form-control" placeholder="Enter Student ID">
                </div>

                <button type="button" onclick="deleteStudent()" class="btn btn-danger">
                   Delete Student
                </button>   

                <a href="dashboard.html" class="btn btn-secondary">
                    Back
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
<script>

async function deleteStudent(){

    let id = document.getElementById("id").value;

    if(id === ""){
        alert("Please enter Student ID");
        return;
    }

    let confirmDelete = confirm("Are you sure you want to delete this student?");

    if(!confirmDelete){
        return;
    }

    try{

        let response = await fetch(
            "http://localhost:8080/student?id=" + id,
            {
                method: "DELETE"
            }
        );

        let message = await response.text();

        alert(message);

    }catch(error){

        console.log(error);

        alert("Cannot connect to server");

    }

}

</script>
